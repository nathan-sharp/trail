services:
  trail:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    container_name: trail-server
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_add:
      - SYS_ADMIN
      - SETUID
      - SETGID
      - CHOWN
    device_cgroup_rules:
      - "b 8:* rmw"
      - "b 259:* rmw"
    cpus: 2.0
    mem_limit: 1024m
    ports:
      - "8080:8080"
    environment:
      TRAIL_BASE_URL: "${TRAIL_BASE_URL:-http://localhost:8080}"
      TRAIL_HOST: "0.0.0.0"
      TRAIL_PORT: "8080"
      TRAIL_DB_PATH: "/app/data/trail.db"
      TRAIL_SEEDS_PATH: "/app/config/seeds.txt"
      TRAIL_USB_DEVICE: "${TRAIL_USB_DEVICE:-}"
      TRAIL_MIN_USB_GB: "${TRAIL_MIN_USB_GB:-500}"
      TRAIL_AUTO_FORMAT: "${TRAIL_AUTO_FORMAT:-true}"
      TRAIL_REPO_URL: "${TRAIL_REPO_URL:-https://github.com/nathan-sharp/trail}"
      TRAIL_VERSION_MANIFEST_URL: "${TRAIL_VERSION_MANIFEST_URL:-}"
      TRAIL_UPDATE_CHECK_INTERVAL_SECONDS: "${TRAIL_UPDATE_CHECK_INTERVAL_SECONDS:-21600}"
      TRAIL_AUTO_UPDATE: "false"
      TRAIL_MAX_HOP_DEPTH: "${TRAIL_MAX_HOP_DEPTH:-2}"
      TRAIL_MAX_PAGES_PER_DOMAIN: "${TRAIL_MAX_PAGES_PER_DOMAIN:-50}"
      TRAIL_CRAWL_DELAY_SECONDS: "${TRAIL_CRAWL_DELAY_SECONDS:-2}"
      TRAIL_CRAWL_BATCH_SIZE: "${TRAIL_CRAWL_BATCH_SIZE:-10}"
      TRAIL_CRAWL_INTERVAL_SECONDS: "${TRAIL_CRAWL_INTERVAL_SECONDS:-30}"
      TRAIL_RESULTS_PER_PAGE: "${TRAIL_RESULTS_PER_PAGE:-10}"
    volumes:
      - "/dev:/dev"
      - "${TRAIL_USB_MOUNT_PATH:-./data}:/app/data:rw"
      - "./config:/app/config:ro"
    networks:
      - trail_internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    container_name: trail-cloudflared
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      trail:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    networks:
      - trail_internal

  trail-updater:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trail-updater
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      trail:
        condition: service_healthy
    environment:
      TRAIL_REPO_URL: "${TRAIL_REPO_URL:-https://github.com/nathan-sharp/trail}"
      TRAIL_VERSION_MANIFEST_URL: "${TRAIL_VERSION_MANIFEST_URL:-}"
      TRAIL_UPDATE_CHECK_INTERVAL_SECONDS: "${TRAIL_UPDATE_CHECK_INTERVAL_SECONDS:-21600}"
      TRAIL_AUTO_UPDATE: "${TRAIL_AUTO_UPDATE:-true}"
    volumes:
      - ".:/app:rw"
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: ["python", "-m", "trail.updater"]
    networks:
      - trail_internal

networks:
  trail_internal:
    driver: bridge
